name: Browser workflow regression
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      E2E_DATABASE_RESET: '1'
      E2E_BACKEND_DIR: ${{ github.workspace }}/backend
      E2E_JWT: synthetic-browser-ci-only
      E2E_PASSWORD: synthetic-browser-ci-only
      SCRAPER_ENABLED: 'false'
      PORTALS_DAILY: 'false'
      SCRAPER_DAILY_PRICING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: mattG111-stack/olliev6
          ref: 9b72fd4fd22aa67d791c53530610f503e0fc4891
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-scraper.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - name: Real isolated API and browser workflows
        run: npm run e2e -- --max-failures=10
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-workflow-results
          path: frontend/test-results
          retention-days: 7
